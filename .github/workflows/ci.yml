name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: '0.14.x'

      - name: Consistency checks
        run: ./scripts/check.sh

      - name: Compile every template
        run: ./tests/run.sh


      # Typst's own lint tool, the same check their CI runs on
      # submissions. It never downloads dependencies, so it reuses the
      # package cache the compile step above just filled.
      - name: typst-package-check
        run: |
          for pkg in $(source scripts/_lib.sh && packages); do
            echo "== $pkg"
            docker run --rm -e XDG_CACHE_HOME=/cache -v "$HOME/.cache:/cache" \
              -v "$PWD/$pkg:/data" ghcr.io/typst/package-check check
          done
