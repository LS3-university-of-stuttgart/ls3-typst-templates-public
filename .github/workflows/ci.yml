name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: '0.14.x'

      - name: Consistency checks
        run: ./scripts/check.sh

      - name: Compile every template
        run: ./tests/run.sh
